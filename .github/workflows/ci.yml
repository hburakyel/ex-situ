name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: frontend
        run: pnpm build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://exsitu.app

  backend:
    name: Backend Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci --omit=dev

      - name: Test
        working-directory: backend
        run: npm test

      - name: Audit
        working-directory: backend
        run: npm audit --audit-level=high || true

  # ── Deploy (push to main only, after both checks pass) ──
  # Off until the repository variable DEPLOY_ENABLED is "true" (see docs/DEPLOY.md).
  changes:
    name: Detect database changes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    outputs:
      db: ${{ steps.diff.outputs.db }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: diff
        name: Check for schema / migration changes
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            files=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
          else
            files=$(git show --name-only --format= "$GITHUB_SHA")
          fi
          # Strapi alters tables from content-type/component schemas on start (a removed
          # field can drop its column); SQL migrations are run by hand.
          db=$(grep -E '^backend/(database/|src/api/[^/]+/content-types/|src/components/|config/database)' <<<"$files" || true)
          if [ -n "$db" ]; then
            echo "db=true" >> "$GITHUB_OUTPUT"
            {
              echo "### Database-related changes: deploy waits for approval"
              echo
              echo "Run any new SQL migrations on the server first, then approve the deploy."
              echo "A database backup is taken automatically before the backend restarts."
              echo
              echo '```'
              echo "$db"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "db=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deploy
    needs: [frontend, backend, changes]
    runs-on: ubuntu-latest
    # production-db has a required reviewer, so database-related pushes pause here.
    environment: ${{ needs.changes.outputs.db == 'true' && 'production-db' || 'production' }}
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The key's forced command on the server only accepts "deploy <sha>".
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 "root@$DEPLOY_HOST" "deploy $GITHUB_SHA"
