# Security overrides for vulnerable transitive deps (pnpm audit). Caret ranges
# so they can't jump a major (e.g. nanoid 5 is ESM-only and breaks postcss).
overrides:
  baseline-browser-mapping@<2.11.0: ^2.11.0
  browserslist@<4.28.7: ^4.28.7
  fflate@>=0.8.0 <0.8.3: ^0.8.3
  nanoid@<3.3.18: ^3.3.18
  postcss-selector-parser@>=6.1.0 <6.1.3: ^6.1.3
  postcss@<8.5.28: ^8.5.28
  protocol-buffers-schema@<3.6.1: ^3.6.1
